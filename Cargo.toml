[workspace]
resolver = "2"
members = [
    "crates/ai-host",
    "crates/ai-protocol",
    "crates/core",
    "crates/daemon",
    "crates/i18n",
    "crates/ipc",
    "crates/ui",
    "crates/update",
    "crates/release-tool",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/TommyZ7/vrc-photon"
authors = ["TommyZ7"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
hex = "0.4"
interprocess = "2.4"
libc = "0.2"
mimalloc = "0.1"
minisign-verify = "0.3"
regex = "1"
rust-i18n = "4.2"
semver = "1"
sha2 = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
quick-xml = "0.42"
thiserror = "2"
imgref = "1"
jpegxl-rs = { version = "0.16", features = ["vendored"] }
ravif = { version = "0.13", default-features = false }
rgb = { version = "0.8", features = ["bytemuck"] }
webp = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "multipart"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
