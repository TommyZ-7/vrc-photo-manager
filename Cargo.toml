[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TommyZ7/vrc-photo-manager"
authors = ["TommyZ7"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
quick-xml = "0.41"
thiserror = "2"
imgref = "1"
jpegxl-rs = { version = "0.14", features = ["vendored"] }
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
webp = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
