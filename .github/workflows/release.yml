name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.check.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case ",${LABELS}," in
            *",bundle-check,"*)
              echo "bundle=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          git fetch origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -qE '(^packaging/|^Packager\.toml$|(^|/)Cargo\.toml$|^Cargo\.lock$|^\.github/workflows/release\.yml$|^\.github/release\.yml$)'; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            squashfs-tools \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache cargo-packager
        id: packager-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: ${{ runner.os }}-cargo-packager-0.11.8

      - name: Install cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build Linux packages
        run: cargo packager --release

      - name: List artifacts
        run: ls -lh dist

      - name: Verify third-party notices
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          appimage=$(ls dist/*.AppImage)
          pacman=$(ls dist/*.tar.gz)

          chmod +x "$appimage"
          if ! "$appimage" --appimage-extract >/dev/null; then
            echo "failed to extract AppImage"
            exit 1
          fi

          for notice in LICENSE LICENSE-LUCIDE; do
            path="usr/lib/vrc-photo-manager/$notice"
            dpkg-deb --contents "$deb" | grep "$path\$" >/dev/null \
              || { echo "missing $notice in deb"; exit 1; }
            test -f "squashfs-root/$path" \
              || { echo "missing $notice in AppImage"; exit 1; }
            tar -tzf "$pacman" | grep "$path\$" >/dev/null \
              || { echo "missing $notice in pacman package"; exit 1; }
          done

          helper="usr/bin/vrc-photo-updater"
          dpkg-deb --contents "$deb" | grep "$helper\$" >/dev/null \
            || { echo "missing $helper in deb"; exit 1; }
          test -f "squashfs-root/$helper" \
            || { echo "missing $helper in AppImage"; exit 1; }
          tar -tzf "$pacman" | grep "$helper\$" >/dev/null \
            || { echo "missing $helper in pacman package"; exit 1; }
          echo "third-party notices and update helper verified"

      - name: Verify systemd user unit
        run: |
          set -euo pipefail
          unit="usr/lib/systemd/user/vrc-photo-daemon.service"
          deb=$(ls dist/*.deb)
          pacman=$(ls dist/*.tar.gz)
          tmp=$(mktemp -d)
          mkdir -p "$tmp/deb" "$tmp/pacman"
          dpkg-deb --extract "$deb" "$tmp/deb"
          tar -xzf "$pacman" -C "$tmp/pacman"
          test -f "$tmp/deb/$unit" \
            || { echo "missing $unit in deb"; exit 1; }
          test -f "$tmp/pacman/$unit" \
            || { echo "missing $unit in pacman package"; exit 1; }
          grep -qx 'ExecStart=/usr/bin/vrc-photo-daemon' "$tmp/deb/$unit" \
            || { echo "unexpected ExecStart in deb unit"; exit 1; }
          grep -qx 'ExecStart=/usr/bin/vrc-photo-daemon' "$tmp/pacman/$unit" \
            || { echo "unexpected ExecStart in pacman unit"; exit 1; }
          echo "systemd user unit verified"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache cargo-packager
        id: packager-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: ${{ runner.os }}-cargo-packager-0.11.8

      - name: Install cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build Windows installer
        run: cargo packager --release -f nsis

      - name: List artifacts
        run: dir dist

      - name: Verify update helper in the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer found" }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found" }
          $listing = & $sevenZip l $installer.FullName
          if (-not ($listing | Select-String -Quiet 'vrc-photo-updater.exe')) {
            throw "vrc-photo-updater.exe is missing from $($installer.Name)"
          }
          Write-Host "update helper found in $($installer.Name)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release tool (without the signing secret)
        run: cargo build -p vrc-photo-release-tool --bin vrc-photo-update-manifest

      - name: Sign artifacts and build the update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-*)
              echo "prerelease tags are not supported by the stable update feed"
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vrc-photo-ui") | .version')
          PACKAGER_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml | head -n1)
          if [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$PACKAGER_VERSION" ]; then
            echo "tag $TAG does not match Cargo ($CARGO_VERSION) and Packager ($PACKAGER_VERSION)"
            exit 1
          fi
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "MINISIGN_SECRET_KEY is not configured; refusing to publish an unsigned update"
            exit 1
          fi

          umask 077
          KEY="$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          mapfile -t PUBLIC_KEYS < <(grep '^RW' packaging/update/keys.txt)
          if [ "${#PUBLIC_KEYS[@]}" -eq 0 ]; then
            echo "no public key in packaging/update/keys.txt"
            exit 1
          fi
          PUB_ARGS=()
          for key in "${PUBLIC_KEYS[@]}"; do
            PUB_ARGS+=(--public-key "$key")
          done

          ./target/debug/vrc-photo-update-manifest sign --key "$KEY" --dist dist
          ./target/debug/vrc-photo-update-manifest verify "${PUB_ARGS[@]}" --dist dist
          ./target/debug/vrc-photo-update-manifest generate \
            --dist dist \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --output dist/latest.json
          ./target/debug/vrc-photo-update-manifest sign --key "$KEY" --file dist/latest.json
          ./target/debug/vrc-photo-update-manifest verify "${PUB_ARGS[@]}" --file dist/latest.json
          jq -e '.schema == 1 and (.platforms | length == 2)' dist/latest.json

      - name: Publish release (tags only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch --tags --force
          PREV=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vxF "$TAG" | head -n1 || true)
          # Release notes are generated from merged PRs by GitHub's
          # generate-notes API; categories come from .github/release.yml.
          if [ -n "$PREV" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREV" \
              --jq '.body' > /tmp/release-notes.md
            RANGE="$PREV..$TAG"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body' > /tmp/release-notes.md
            RANGE="$TAG"
          fi
          # The version-bump PR itself is not a user-facing change.
          grep -v -E '^\* chore: release v[0-9]' /tmp/release-notes.md > /tmp/release-notes.tmp || true
          mv /tmp/release-notes.tmp /tmp/release-notes.md
          # Commits that belong to no PR (direct pushes) are listed separately.
          OTHER=$(git log "$RANGE" --first-parent --no-merges --pretty=format:'- %s (%h)' | grep -v -E '\(#[0-9]+\)$' || true)
          if [ -n "$OTHER" ]; then
            printf '\n### その他の変更\n\n%s\n' "$OTHER" >> /tmp/release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md dist/*
          fi
