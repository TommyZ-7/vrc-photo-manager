[package]
name = "vrc-photon-ai-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vrc-photon-ai-protocol = { path = "../ai-protocol" }
hex.workspace = true
minisign = { version = "0.10", optional = true }
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true
tracing.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
assert_cmd = "2"
minisign = "0.10"
tempfile = "3"

[features]
test-support = ["dep:minisign"]
# Exposes the in-memory EOCD validator to the standalone `fuzz/` workspace.
# Not enabled for normal builds.
fuzz-support = []
