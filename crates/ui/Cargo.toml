[package]
name = "vrc-photon-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vrc-photon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel = "2.5"
chrono.workspace = true
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mimalloc.workspace = true
rfd = "0.17"
semver.workspace = true
serde_json.workspace = true
smallvec = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
trash = "5"
vrc-photon-ai-protocol = { path = "../ai-protocol" }
vrc-photon-core = { path = "../core" }
vrc-photon-i18n = { path = "../i18n" }
vrc-photon-ipc = { path = "../ipc" }
vrc-photon-update = { path = "../update" }

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
