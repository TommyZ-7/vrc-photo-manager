[package]
name = "vrc-photo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vrc-photo-daemon"
path = "src/main.rs"

[lib]
name = "vrc_photo_daemon"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
auto-launch = "0.6"
chrono.workspace = true
clap.workspace = true
interprocess.workspace = true
notify = "8"
single-instance = "0.3"
trash = "5"
tracing.workspace = true
tracing-subscriber.workspace = true
vrc-photo-core = { path = "../core" }
vrc-photo-ipc = { path = "../ipc" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
