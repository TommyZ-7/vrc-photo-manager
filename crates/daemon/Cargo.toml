[package]
name = "vrc-photon-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vrc-photon-daemon"
path = "src/main.rs"

[lib]
name = "vrc_photon_daemon"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
auto-launch = "0.6"
chrono.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess.workspace = true
mimalloc.workspace = true
notify = "8"
serde_json.workspace = true
single-instance = "0.3"
thiserror.workspace = true
trash = "5"
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
url.workspace = true
vrc-photon-ai-host = { path = "../ai-host" }
vrc-photon-ai-protocol = { path = "../ai-protocol" }
vrc-photon-core = { path = "../core" }
vrc-photon-i18n = { path = "../i18n" }
vrc-photon-ipc = { path = "../ipc" }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
vrc-photon-ai-host = { path = "../ai-host", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
