name = "vrc-photon"
productName = "VRC PhotoN"
version = "0.12.0"
identifier = "com.tommyz.vrc-photon"
description = "VRChat photo library with log-based world/player context and built-in compression."
longDescription = "Index VRChat screenshots, link them to the world and players from VRChat output logs and XMP metadata, then search and compress them locally."
homepage = "https://github.com/TommyZ-7/vrc-photon"
authors = ["TommyZ7"]
licenseFile = "LICENSE"
resources = [
  "LICENSE",
  "packaging/licenses/LICENSE-LUCIDE",
  "packaging/licenses/THIRD-PARTY-NOTICES.md",
]
category = "Photography"
outDir = "dist"
binariesDir = "target/release"
beforePackagingCommand = "cargo build --release -p vrc-photon-ui -p vrc-photon-daemon -p vrc-photon-update"
formats = ["deb", "appimage", "pacman"]
icons = ["packaging/icons/icon.png"]

[[binaries]]
path = "vrc-photon"
main = true

[[binaries]]
path = "vrc-photon-daemon"

[[binaries]]
path = "vrc-photon-updater"

[linux]
generateDesktopEntry = true

[deb]
packageName = "vrc-photon"
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libvulkan1",
  "libx11-6",
  "libxcb1",
  "libfontconfig1",
  "libfreetype6",
]

[deb.files]
"packaging/systemd/vrc-photon-daemon.service" = "usr/lib/systemd/user/vrc-photon-daemon.service"
"packaging/polkit/com.tommyz.vrc-photon.update.policy" = "usr/share/polkit-1/actions/com.tommyz.vrc-photon.update.policy"

[pacman]
depends = [
  "libxkbcommon",
  "wayland",
  "vulkan-icd-loader",
  "libx11",
  "libxcb",
  "fontconfig",
  "freetype2",
]

[pacman.files]
"packaging/systemd/vrc-photon-daemon.service" = "usr/lib/systemd/user/vrc-photon-daemon.service"
"packaging/polkit/com.tommyz.vrc-photon.update.policy" = "usr/share/polkit-1/actions/com.tommyz.vrc-photon.update.policy"
